name: Infra CPU contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: slackkv doctor --config configs/local.json --config-only
      - run: python -m pytest tests/test_infra.py tests/test_infra_reliability.py tests/test_infra_native.py tests/test_infra_benchmark.py tests/test_system_m1.py tests/test_system_m1_shared.py -q
        env:
          CUDA_VISIBLE_DEVICES: ''
