[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slackkv"
version = "0.1.0"
description = "Multi-session prefix admission and observability on native vLLM offload"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
slackkv = "slackkv.infra.cli:main"

[tool.setuptools.packages.find]
include = ["slackkv*"]

[tool.setuptools.package-data]
"slackkv.infra" = ["*.json"]
